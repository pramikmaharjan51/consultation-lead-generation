<style>
:root{--primary:#c6ff00;--bg:#080808;--panel:#151515;--text:#fff;--muted:#aaa}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
header{height:76px;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:center;padding:0 24px}
.brand{font-weight:900;letter-spacing:-.5px}.brand span{display:inline-grid;place-items:center;background:var(--primary);color:#080808;border-radius:50%;width:28px;height:28px;margin-right:8px}
main{min-height:calc(100vh - 76px);display:flex;align-items:center;justify-content:center;padding:56px 20px}
.thank-you{display:block!important;text-align:center;width:min(100%,850px);padding:30px 0}
.thank-you-tag{display:inline-flex;gap:8px;color:var(--primary);font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:22px}
.thank-you h1{font-size:clamp(38px,7vw,68px);line-height:1.05;color:var(--primary);margin:0 0 22px;font-weight:900}
.thank-you p{color:var(--muted);font-size:clamp(16px,2vw,19px);line-height:1.7;max-width:700px;margin:0 auto 30px}
.video-container{width:min(100%,800px);aspect-ratio:16/9;background:#111;border:1px solid #303030;border-radius:10px;display:grid;place-items:center;margin:0 auto 32px;color:#888;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#20d568;color:#fff;text-decoration:none;font-weight:800;padding:18px 28px;border-radius:8px;min-height:58px}
.btn:hover{filter:brightness(1.08)}
footer{text-align:center;color:#777;border-top:1px solid #242424;padding:22px;font-size:12px}
</style>
